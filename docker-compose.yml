# docker-compose.yml — single-service harness with OS-level isolation.
# G2 Edit example:
#   docker compose run --rm --entrypoint uv harness run python scripts/run_g2_compound_edit.py --case /app/workdir/one_case.json --output /app/workdir/run --model gpt-5.6-luna --max-steps 1
#
# Usage:
#   docker compose run --rm harness "<prompt>" --workdir /app/workdir --plan-only
#   docker compose run --rm harness "<prompt>" --workdir /app/workdir --playwright-headless
#
# .env in the project root is loaded automatically by compose for variable
# interpolation (ANTHROPIC_API_KEY etc.). It is NOT auto-mounted into the
# container — we forward only the keys we need via `environment:` below.

services:
  harness:
    image: webcoding-edit-harness:20260926
    build:
      context: ..
      dockerfile: harness/Dockerfile
      network: host

    # Lifecycle / namespace knobs.
    init: true                 # PID 1 reaper; reaps zombie chromium / vite children
    user: ${HARNESS_UID:-1000}:${HARNESS_GID:-1000}
    network_mode: host         # physical Docker daemon has no usable docker0 bridge
    shm_size: 2gb

    # OS-level isolation.
    read_only: true            # root FS is immutable; only tmpfs + bind mounts are writable
    tmpfs:
      - /tmp:exec,size=2g
      - /home/pwuser/.cache:size=512m
      - /home/pwuser/.claude:size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # Resource limits (single-host compose accepts these top-level fields).
    pids_limit: 2048
    mem_limit: ${HARNESS_MEMORY_LIMIT:-16g}
    cpus: ${HARNESS_CPUS:-8.0}

    # List form (`- VAR`) forwards a key only when it is set on the host,
    # so unset host env → key absent in container → src/config.py's
    # `os.getenv(KEY, default)` returns the actual default. A map form
    # with `KEY: "${KEY:-}"` would set unset vars to empty strings and
    # silently bypass every fallback — e.g. an empty
    # EVALUATOR_VISION_ENDPOINT_TYPE would crash vision_scorer.py.
    environment:
      # Credentials & endpoint URLs.
      - ANTHROPIC_API_KEY
      - ANTHROPIC_BASE_URL
      - EVALUATOR_VISION_API_KEY
      - EVALUATOR_VISION_BASE_URL
      - NJULINK_API_KEY
      - OPENAI_API_KEY
      - OPENAI_BASE_URL
      - OPENAI_WIRE_API
      - HTTP_PROXY
      - HTTPS_PROXY
      - NO_PROXY
      - HARNESS_UID
      - HARNESS_GID
      # Endpoint-shape switch — controls anthropic vs openai-compatible payload.
      - EVALUATOR_VISION_ENDPOINT_TYPE
      # Model overrides.
      - PLANNER_MODEL
      - GENERATOR_MODEL
      - EVALUATOR_MODEL
      - EVALUATOR_VISION_MODEL
      # Int-typed runtime knobs.
      - EVALUATOR_VISION_MAX_TOKENS
      - SDK_MAX_BUFFER_SIZE
      # FRONTEND_PORT is deliberately NOT forwarded — the port mapping
      # below is hardcoded to 5173. Changing the port requires editing
      # both --frontend-port and the ports: line.

    # Bind mount: harness output lives on host so the caller can inspect
    # it after `docker compose run --rm` exits. HARNESS_WORKDIR lets
    # callers swap the host directory per prompt (unset → ./workdir).
    volumes:
      - ${HARNESS_DATA_ROOT:-./workdir}:/data:rw

    secrets:
      - njulink_api_key

secrets:
  njulink_api_key:
    file: ${NJULINK_KEY_FILE:-/dev/null}
